# fleet-control with Docker: fleet-server + an HTTPS proxy.
#   docker compose up -d     then open https://<server>/ and choose the password
# Optional settings (ports, certificate names) go in .env; see .env.example.
# The agents run directly on each machine (they control its systemd), not in Docker.
name: fleet

services:
  server:
    build: .
    restart: unless-stopped
    environment:
      FLEET_TRUST_PROXY: uniquelocal
    volumes:
      - data:/app/data            # the SQLite database, fleet.db

  proxy:
    build:
      context: .
      dockerfile: docker/proxy.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      FLEET_CERT_NAMES: ${FLEET_CERT_NAMES:-DNS:fleet}
    ports:
      - "${FLEET_HTTP_PORT:-80}:80"
      - "${FLEET_HTTPS_PORT:-443}:443"
    volumes:
      - certs:/etc/nginx/certs

volumes:
  data:
  certs:
