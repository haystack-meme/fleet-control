# HTTPS for fleet-server (browsers and agents); HTTP redirects to HTTPS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fleet.crt;
    ssl_certificate_key /etc/nginx/certs/fleet.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Your own extra locations (e.g. a public file folder): mount *.conf files into /etc/nginx/fleet.d/ with a
    # compose.override.yaml (git-ignored). See the README.
    include /etc/nginx/fleet.d/*.conf;

    location / {
        proxy_pass http://server:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;          # agents connect with a WebSocket to /agent
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
